name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  # 也可以在 Actions 分頁手動按一次，不必硬推一筆提交
  workflow_dispatch:

# deploy-pages 走的是 OIDC 換權杖那條路，所以 pages 與 id-token 兩個權限缺一不可
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 刻意不取消進行中的部署：正在發布的那一次讓它跑完，排隊中的舊的自然會被新的擠掉。
  # 取消到一半會留下半套的線上版本。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 對齊作者機器上的 Node 24；cache: npm 會拿 package-lock.json 當快取鍵，所以鎖檔一定要進版控
          node-version: '24'
          cache: npm
      # 用 ci 不用 install：完全照 package-lock.json 裝，版本不會偷偷漂掉
      - run: npm ci
      - run: npm test
      # build 這條本身就是 tsc --noEmit && vite build，型別錯了會在這裡擋下來
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
